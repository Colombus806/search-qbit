name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy needs the same Python version as the one embedded in the app.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: gradle/actions/setup-gradle@v6

      - name: Plugin engine tests (Python)
        run: python -m unittest discover -s app/src/test/python -t app/src/test/python -v

      # A repository pushed from Windows often loses the executable bit on gradlew.
      - name: Build the APK and run the tests
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: search-qbit-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload the test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/
